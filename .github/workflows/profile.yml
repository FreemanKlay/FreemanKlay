# Updates the profile cards and the generated banner. Replaces the old cool-readme.yml workflow.
name: Update profile

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 1. stats cards (summary, weekly), drawn by github-cool-readme
      - uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.CARDS_TOKEN }}
          output: ${{ runner.temp }}/cards

      # 2. read your recent activity (public only; set INCLUDE_PRIVATE to 'true' to count private work,
      #    which then needs a token with the repo scope)
      - name: Read activity
        env:
          PROFILE_TOKEN: ${{ secrets.PULSE_TOKEN || secrets.CARDS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          INCLUDE_PRIVATE: 'false'
        run: python3 scripts/fetch_activity.py "$RUNNER_TEMP/activity.json"

      # 3. draw banner, languages card and stack pills; move the stats cards onto our green
      - name: Draw
        run: |
          python3 scripts/recolor_cards.py "$RUNNER_TEMP/cards"
          python3 scripts/build_all.py --data "$RUNNER_TEMP/activity.json" --out "$RUNNER_TEMP/cards"

      # 4. everything lives on the cards branch, as one commit replaced on each change
      - name: Publish on the cards branch
        run: |
          if ! ls "$RUNNER_TEMP"/cards/*.svg >/dev/null 2>&1; then echo "Nothing to publish"; exit 0; fi
          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true
          git switch --quiet --orphan cards
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Update profile'
          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then
            echo "No changes"
            exit 0
          fi
          git push --force origin cards
