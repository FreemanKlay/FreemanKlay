<text x="67.14285714285714" y="184" text-anchor="middle" class="small secondary">Tue</text>
<text x="98.57142857142857" y="184" text-anchor="middle" class="small secondary">Wed</text>
<path class="rise" style="animation-delay: 380ms" d="M120.99999999999999 166V74Q120.99999999999999 70 124.99999999999999 70H135Q139 70 139 74V166Z" fill="#13aa4a"/><text x="130" y="184" text-anchor="middle" class="small secondary">Thu</text>
<text x="161.42857142857144" y="184" text-anchor="middle" class="small secondary">Fri</text>
<path class="rise" style="animation-delay: 500ms" d="M183.85714285714286 166V58Q183.85714285714286 54 187.85714285714286 54H197.85714285714286Q201.85714285714286 54 201.85714285714286 58V166Z" fill="#13aa4a"/><text x="192.85714285714286" y="184" text-anchor="middle" class="small secondary">Sat</text>
<text x="224.28571428571428" y="184" text-anchor="middle" class="small secondary">Sun</text>
<g transform="translate(258 46)"><g class="fade" style="animation-delay: 470ms"><text y="11" class="small secondary">Busiest day · 7</text><text y="34" style="font-size: 20px; font-weight: 700;">Saturday</text></g></g>
